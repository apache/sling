# ---------------------------------------------------------------------------
# §13 Triage dispositions — provisional (M1)
# ---------------------------------------------------------------------------
dispositions_status: provisional
dispositions:
  - label: VALID
    definition: Violates a §8 property via an in-scope §7 adversary with §6-attacker-controllable input.
    licensed_by: "§6, §7, §8"
  - label: VALID-HARDENING
    definition: No §8 property violated, but a §11 misuse is easy enough that Sling elects to harden (often opt-in/off-by-default). Fixed at PMC discretion; may or may not get a CVE.
    licensed_by: "§11"
  - label: "OUT-OF-MODEL: trusted-input"
    definition: Requires attacker control of a §6 parameter marked trusted (repoinit, content-package source, operator config, env-var placeholders, Kafka journal message).
    licensed_by: "§6"
  - label: "OUT-OF-MODEL: adversary-not-in-scope"
    definition: Requires a §7-excluded capability (admin, code deploy, JVM control, side-channel observation).
    licensed_by: "§7"
  - label: "OUT-OF-MODEL: unsupported-component"
    definition: Lands in §3 code (samples, archetypes, tooling, site/infra).
    licensed_by: "§3"
  - label: "OUT-OF-MODEL: non-default-build"
    definition: Only manifests under a §5a knob / assembly default the maintainer marks dev-only.
    licensed_by: "§5a"
  - label: "OUT-OF-MODEL: assembly-level"
    definition: About an assembly's composition/defaults (Starter, Sling CMS), not a per-bundle property.
    licensed_by: "§1, §2"
  - label: "BY-DESIGN: property-disclaimed"
    definition: Concerns a §9 disclaimed property or false friend.
    licensed_by: "§9"
  - label: KNOWN-NON-FINDING
    definition: Matches a §11a pattern.
    licensed_by: "§11a"
  - label: DEPENDENCY-NON-FINDING
    definition: Vulnerable transitive dependency outside the Dependabot exceptions; verify actual usage first.
    licensed_by: "§3 / Dependabot wiki"
  - label: PUNT-UPSTREAM
    definition: The flaw is in Jackrabbit Oak / Tika / Felix / another upstream; coordinate there.
    licensed_by: "§3, §9"
  - label: MODEL-GAP
    definition: Cannot be routed to the above; triggers a §12 revision.
    licensed_by: "(none — by definition)"
